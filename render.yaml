services:
  - type: web
    name: powerplayclub
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: POWERPLAY_OWNER_EMAIL
        sync: false
      - key: POWERPLAY_OWNER_PASSWORD
        sync: false
